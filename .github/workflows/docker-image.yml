name: Build & Publish to GHCR

# Publishes the Homepage Manager container image to GitHub Container Registry
# (ghcr.io/<owner>/homepage-manager).
#
#   - push to `main`            -> ghcr tag `latest`
#   - version tag `v1.2.3`      -> ghcr tags `v1.2.3`, `1.2.3`, `1.2`, `1`
#   - pull requests             -> builds only (no publish), to catch breakage
#   - manual `workflow_dispatch`-> publishes whatever branch you select
#
# The image is built natively for linux/amd64 (the standard runner's
# architecture). To also publish arm64, run the build on native ARM64 runners
# (e.g. a matrix with ubuntu-24.04-arm) instead of emulating under QEMU, which
# is very slow for this Node/Vite image.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  # ghcr.io/<owner>/<repo> — e.g. ghcr.io/lucif3r-d3vil/homepage-manager
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build-and-push:
    name: Build & push image
    runs-on: ubuntu-latest
    # Publishing needs a token with `packages: write`; pull_request runs only
    # build a dry-run image so forks/PRs don't get write access.
    permissions:
      contents: read
      packages: write
    concurrency:
      group: ghcr-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        # Only log in when we actually intend to push (main / tags / dispatch).
        if: ${{ github.event_name != 'pull_request' }}
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            # Guarantees a publishable tag for main pushes and manual dispatches.
            type=sha,prefix=sha-,format=short,enable=${{ github.event_name != 'pull_request' }}
          labels: |
            org.opencontainers.image.title=Homepage Manager
            org.opencontainers.image.description=A self-hosted editor for Homepage (gethomepage.dev) dashboard configuration.
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
